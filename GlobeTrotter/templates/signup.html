{% extends "base.html" %}{% block title %}Registration · GlobeTrotter{% endblock %}
{% block content %}<div class="auth-page"><div class="auth-card auth-wide"><div class="auth-icon"><i class="bi bi-person-plus"></i></div><span class="eyebrow">SCREEN 2</span><h2>Create your profile</h2><p>Tell GlobeTrotter a little about you.</p><form method="post" novalidate>
{{ csrf_field() }}<div class="row g-3"><div class="col-md-6"><label>Full name</label><input class="form-control" name="name" required minlength="2" maxlength="120"></div><div class="col-md-6"><label>Email address</label><input class="form-control" type="email" name="email" required></div><div class="col-md-6"><label>Password</label><input class="form-control" type="password" name="password" required minlength="8"></div><div class="col-md-6"><label>Confirm password</label><input class="form-control" type="password" name="confirm_password" required></div></div><div class="password-hint">Use 8+ characters with uppercase, lowercase and a number.</div><button class="btn btn-brand w-100 rounded-pill mt-3">Register User</button></form></div></div>{% endblock %}
