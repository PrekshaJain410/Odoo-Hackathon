{% extends "base.html" %}{% block title %}Login · GlobeTrotter{% endblock %}
{% block content %}<div class="auth-page"><div class="auth-card"><div class="auth-icon"><i class="bi bi-compass"></i></div><span class="eyebrow">SCREEN 1</span><h2>Welcome back</h2><p>Pick up your journey where you left off.</p><form method="post" novalidate>
